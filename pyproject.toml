[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "als-decode"
version = "0.1.0"
description = "EEG BCI for ALS / Locked-In Syndrome — three-stage communication system"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = [
    "torch>=2.4.0,<3.0",
    "pytorch-lightning>=2.4.0,<3.0",
    "mne>=1.7.0",
    "braindecode>=0.8.0",
    "moabb>=1.5.0",
    "pyriemann>=0.7",
    "hydra-core>=1.3.2,<2.0",
    "omegaconf>=2.3.0",
    "wandb>=0.18.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not data'"
markers = [
    "data: tests that require the MOABB data cache (skipped in default CI run)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
