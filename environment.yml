name: als-decode
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=23.0
  - pip:
    # Deep learning — stay within the 2.x families
    - torch>=2.4.0,<3.0
    - pytorch-lightning>=2.4.0,<3.0
    # EEG / BCI
    - mne>=1.7.0
    - braindecode>=0.8.0
    - moabb>=1.5.0
    - pyriemann>=0.7
    # Config + tracking
    - hydra-core>=1.3.2,<2.0
    - omegaconf>=2.3.0
    - wandb>=0.18.0
    # Numerics
    - numpy>=1.26.0
    - scipy>=1.13.0
    - scikit-learn>=1.5.0
    - pandas>=2.2.0
    - matplotlib>=3.9.0
    # Dev
    - pytest>=8.3.0
    - pytest-cov>=5.0.0
    - ruff>=0.7.0
    # Install this package in editable mode
    - -e .
